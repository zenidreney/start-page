<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Title</title>

        <!--Google Fonts-->

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Ancizar+Sans:ital,wght@0,100..1000;1,100..1000&family=Bitcount+Grid+Single:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet" />

        <!--Bootstrap Icons-->

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

        <!--Custom Styles-->

        <link rel="stylesheet" href="index.css" />
    </head>

    <body>
        <!--<img src="https://picsum.photos/200/300">-->

        <main class="main-grid-box" id="main-grid-box">
            <!--GRID 1-->

            <div class="grid-item-1">
                <div>
                        <button id="change-loc-btn">Change Location<i class="bi bi-geo-alt"></i></button>
                    <form class= "location-form" id="location-form">
                        <input type="search" id="input-location" name="location" placeholder="Enter city." />
                        <button id="get-loc-btn">Get Weather</button>
                    </form>
                </div>

                <div class="background">
                    <h3><span id="city-name"></span></h3>
                    <p>Av. <span id="mean-temp"></span>°C</p>
                    <p>Min. <span id="min-temp"></span>°C</p>
                    <p>Max. <span id="max-temp"></span>°C</p>
                    <a href="https://open-meteo.com/">Weather data by Open-Meteo.com</a>
                </div>
            </div>

            <!--GRID 2-->

            <div class="grid-item-2">
                <time id="current-time"></time>
            </div>

            <!--GRID 3-->

            <div class="grid-item-3">
                <!-- DuckDuckGo Search Form -->
                <form action="https://duckduckgo.com/" method="get" target="_blank">
                    <input type="text" name="q" placeholder="Search (DuckDuckGo...)" />
                    <div>
                        <button type="submit">Search</button>
                    </div>
                </form>
            </div>

            <!--GRID 4-->

            <div class="grid-item-4">
                <div class="background">
                    <h3>Meditation of the Day</h3>
                    <h4 id="quote-author"></h4>
                    <p id="quote"></p>
                </div>
            </div>

            <!--GRID 5-->

            <div class="grid-item-5">
                <div id="photo-info">
                    <p>Photo by:</p>
                    <!--Link from index.js-->
                </div>
            </div>
        </main>

        <script src="index.js"></script>
    </body>
</html>
